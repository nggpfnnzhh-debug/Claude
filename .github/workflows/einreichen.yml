# Reicht die in App Store Connect vorbereitete Version mit dem neuesten Build zur Prüfung ein.
# Baut nichts neu und ändert weder Texte noch Screenshots. Läuft auf Linux (kein Mac nötig).
name: App Store – Einreichen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, die eingereicht werden soll (z. B. 2.1.0)"
        required: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: fastlane installieren
        run: gem install fastlane --no-document
      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Zur Prüfung einreichen
        run: fastlane ios submit
