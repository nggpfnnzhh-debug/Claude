# Baut die App, erzeugt Screenshots, lädt App, Texte und Screenshots zu App Store Connect hoch
# und reicht die App auf Wunsch direkt zur Prüfung ein.
# Benötigte Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (siehe docs/APP_STORE.md)
name: App Store – Hochladen & Einreichen

on:
  workflow_dispatch:
    inputs:
      einreichen:
        description: "Direkt zur Prüfung bei Apple einreichen?"
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      # Apple verlangt für den App Store das iOS-26-SDK (Xcode 26 oder neuer).
      - name: Neuestes Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Kein Xcode 26+ gefunden"; ls /Applications; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Voraussetzungen prüfen
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name fehlt (siehe docs/APP_STORE.md)"; exit 1; fi
          done
          if grep -rl "BITTE AUSFÜLLEN" docs fastlane/metadata; then
            echo "::error::Platzhalter in den oben genannten Dateien müssen noch ausgefüllt werden."
            exit 1
          fi

      - name: Werkzeuge und Projekt
        run: |
          brew install xcodegen
          command -v fastlane || brew install fastlane
          xcodegen generate

      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"

      - name: App archivieren und signieren
        run: |
          set -o pipefail
          # Unsigniert archivieren; signiert wird erst beim Export mit einem
          # cloud-verwalteten Vertriebszertifikat (kein registriertes Gerät nötig).
          xcodebuild archive \
            -project KleineEntdecker.xcodeproj \
            -scheme KleineEntdecker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KleineEntdecker.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)"
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/KleineEntdecker.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la build/export

      - name: Screenshots erzeugen
        run: |
          set -o pipefail
          xcodebuild build \
            -project KleineEntdecker.xcodeproj \
            -scheme KleineEntdecker \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO
          scripts/screenshots.sh build/sim/Build/Products/Debug-iphonesimulator/KleineEntdecker.app fastlane/screenshots/de-DE

      - name: Screenshots als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: App-Store-Screenshots
          path: fastlane/screenshots/de-DE

      - name: Hochladen zu App Store Connect
        run: fastlane ios store ipa:build/export/KleineEntdecker.ipa submit:${{ inputs.einreichen }}
