name: iOS Build & Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren und Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Tests im iPhone-Simulator ausführen
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project KleineEntdecker.xcodeproj \
            -scheme KleineEntdecker \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # Simulator-Build zum Testen ohne Mac, z. B. im Browser über https://appetize.io
      - name: Simulator-App bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project KleineEntdecker.xcodeproj \
            -scheme KleineEntdecker \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          cd build/sim/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent KleineEntdecker.app "$GITHUB_WORKSPACE/KleineEntdecker-Simulator.zip"

      - name: Simulator-App bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: KleineEntdecker-Simulator
          path: KleineEntdecker-Simulator.zip
