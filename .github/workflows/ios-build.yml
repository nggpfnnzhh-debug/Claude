name: iOS Build & Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac-Image (Standard macos-26; Ausweichen z. B. auf macos-15)
        required: false
        default: macos-26

# Ältere Läufe desselben Branches abbrechen, wenn neue Änderungen kommen (spart Mac-Rechenzeit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: write
    # Bei Engpässen kann manuell ein anderes Mac-Image gewählt werden (es muss Xcode 26+ enthalten).
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Apple verlangt für den App Store das iOS-26-SDK (Xcode 26 oder neuer).
      - name: Neuestes Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Kein Xcode 26+ gefunden"; ls /Applications; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: XcodeGen installieren und Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Tests im iPhone-Simulator ausführen
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "Simulator: $UDID"
          xcodebuild test \
            -project KleineEntdecker.xcodeproj \
            -scheme KleineEntdecker \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # Simulator-Build zum Testen ohne Mac, z. B. im Browser über https://appetize.io
      - name: Simulator-App bauen
        run: |
          set -o pipefail
          xcodebuild build \
            -project KleineEntdecker.xcodeproj \
            -scheme KleineEntdecker \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          cd build/sim/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent KleineEntdecker.app "$GITHUB_WORKSPACE/KleineEntdecker-Simulator.zip"

      - name: Simulator-App bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: KleineEntdecker-Simulator
          path: KleineEntdecker-Simulator.zip

      - name: Screenshots erzeugen (Vorschau)
        env:
          PREVIEW_SMALL_IPHONE: "1"
        run: scripts/screenshots.sh build/sim/Build/Products/Debug-iphonesimulator/KleineEntdecker.app screenshots

      - name: Screenshots bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots-Vorschau
          path: screenshots

      # Vorschau zum Ansehen ohne Download: verkleinerte Bilder im Branch "screenshot-vorschau-<branch>"
      - name: Vorschau in eigenen Branch legen
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          for f in screenshots/*.png; do
            sips -Z 900 "$f" --out "$RUNNER_TEMP/preview/$(basename "$f")" >/dev/null
          done
          cd "$RUNNER_TEMP/preview"
          git init -q -b "screenshot-vorschau-${GITHUB_REF_NAME}"
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Screenshot-Vorschau für ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "screenshot-vorschau-${GITHUB_REF_NAME}"
