# Vertont alle Sätze der App mit der Piper-Stimme „Kerstin“ und legt das Ergebnis im Branch "stimme-kerstin" ab.
name: Stimme erzeugen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q "piper-tts==1.8.0"
          python3 -m piper.download_voices --download-dir "$RUNNER_TEMP/voices" de_DE-kerstin-low

      - name: Sätze vertonen
        run: python3 scripts/voice/generate.py "$RUNNER_TEMP/voices/de_DE-kerstin-low.onnx" "$RUNNER_TEMP/Voice"

      - name: In Branch ablegen
        run: |
          cd "$RUNNER_TEMP/Voice"
          du -sh .
          git init -q -b stimme-kerstin
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Kerstin-Aufnahmen für ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stimme-kerstin
