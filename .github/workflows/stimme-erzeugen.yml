# Vertont alle Sätze der App mit einer Microsoft-Azure-Stimme und legt Aufnahmen + Manifest
# im Branch "stimme-azure" ab. Benötigte Secrets: AZURE_SPEECH_KEY, AZURE_SPEECH_REGION.
name: Stimme erzeugen

on:
  workflow_dispatch:
    inputs:
      stimme:
        description: "Azure-Stimme (optional mit Einstellungen, z. B. de-DE-KatjaNeural;rate=-8%)"
        default: "de-DE-KatjaNeural"

permissions:
  contents: write

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Voraussetzungen prüfen
        run: |
          for name in AZURE_SPEECH_KEY AZURE_SPEECH_REGION; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name fehlt"; exit 1; fi
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null

      - name: Sätze vertonen
        run: |
          mkdir -p "$RUNNER_TEMP/Voice"
          echo "Stimme: ${{ inputs.stimme }} (Microsoft Azure Sprachsynthese)" > "$RUNNER_TEMP/Voice/STIMME.txt"
          python3 scripts/voice/generate.py azure "${{ inputs.stimme }}" "$RUNNER_TEMP/Voice"

      - name: In Branch ablegen
        run: |
          cd "$RUNNER_TEMP/Voice"
          du -sh .
          git init -q -b stimme-azure
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Aufnahmen für ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stimme-azure
