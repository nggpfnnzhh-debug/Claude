# Baut das Lernlabor, signiert es automatisch (Cloud-Signing) und lädt es zu TestFlight hoch.
# Nutzt dieselben Repository-Secrets wie Huhu Eule:
#   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
# Vorher muss die App in App Store Connect angelegt sein (siehe Lernlabor/docs/TESTFLIGHT.md).
name: Lernlabor – Upload zu TestFlight

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Mac-Image (Standard macos-26; Ausweichen z. B. auf macos-15)
        required: false
        default: macos-26

jobs:
  upload:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Lernlabor
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Kein Xcode 26+ gefunden"; ls /Applications; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Secrets prüfen
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name fehlt"; exit 1; fi
          done

      - name: Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: API-Schlüssel ablegen
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archivieren
        run: |
          set -o pipefail
          # Unsigniert archivieren; signiert wird erst beim Export mit einem
          # cloud-verwalteten Vertriebszertifikat (kein registriertes Gerät nötig).
          xcodebuild archive \
            -project Lernlabor.xcodeproj \
            -scheme Lernlabor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lernlabor.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)"

      - name: Zu App Store Connect hochladen
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Lernlabor.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
