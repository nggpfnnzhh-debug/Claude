// ---------- Hilfen ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const level = (v) => v < 35 ? "lo" : v > 65 ? "hi" : "mid";
const levelText = { lo: "eher wenig", mid: "mittel", hi: "eher viel" };

function norm(s) {
  return s.toLowerCase().trim()
    .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
    .replace(/^(der|die|das|ein|eine|einen)\s+/, "").replace(/[^a-z]/g, "");
}
function lev(a, b) {
  const m = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i-1][j] + 1, m[i][j-1] + 1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}
function correct(answer, word) {
  const a = norm(answer); if (!a) return false;
  return [word[1]].concat(word[2] || []).some(t => { const n = norm(t); return a === n || (n.length >= 4 && lev(a, n) <= 1); });
}

// Vorläufige Vergleichswerte (Mittelwert, Streuung je Eigenschaft) nach der Mini-IPIP-Originalstudie
// (US-Studierende, Donnellan u. a. 2006). Für die echte App durch deutsche Normwerte ersetzen.
// N ist hier schon als Gelassenheit (6 − Neurotizismus) angegeben.
const NORMS = { E: [2.96, 0.88], A: [3.84, 0.70], C: [3.37, 0.80], N: [3.43, 0.78], O: [3.64, 0.73] };

// Durchschnitt der Antworten je Eigenschaft (1 bis 5), umgepolte Aussagen eingerechnet
function means(answers) {
  const sum = {}, cnt = {};
  ITEMS.forEach((it, i) => {
    const [t, key] = it; const v = answers[i]; if (v == null) return;
    const val = key > 0 ? v : 6 - v;
    sum[t] = (sum[t] || 0) + val; cnt[t] = (cnt[t] || 0) + 1;
  });
  const out = {};
  for (const t in sum) out[t] = sum[t] / cnt[t];
  if (out.N != null) out.N = 6 - out.N; // als Gelassenheit
  return out;
}

// Standardnormalverteilung (Näherung nach Abramowitz & Stegun)
function phi(z) {
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2);
  return z >= 0 ? (1 + y) / 2 : (1 - y) / 2;
}

// Prozentrang: Bei wie vielen von 100 Menschen ist die Eigenschaft schwächer ausgeprägt?
function percentiles(m) {
  const out = {};
  for (const t in NORMS) out[t] = Math.min(99, Math.max(1, Math.round(phi((m[t] - NORMS[t][0]) / NORMS[t][1]) * 100)));
  return out;
}
function profileScores(p) {
  if (!p) return EXAMPLE;
  if (p.means) return percentiles(p.means);
  return p.scores; // ältere Speicherstände
}

function verdict(r) {
  const d = r.quiz - r.read;
  if (Math.abs(d) >= 3) return d > 0
    ? ["Abfragen hat bei dir klar gewonnen.", "Ein Unterschied von 3 oder mehr Wörtern ist ein deutlicher Hinweis."]
    : ["Nochmal lesen hat bei dir klar gewonnen.", "Ungewöhnlich, aber möglich. Wiederhole den Versuch, um sicherzugehen."];
  if (d === 0) return ["Kein Unterschied.", "Bei so wenigen Wörtern heißt das: Wiederholen lohnt sich, am besten mit Pause."];
  return [(d > 0 ? "Abfragen" : "Nochmal lesen") + " liegt knapp vorne.", "1 oder 2 Wörter Unterschied können Zufall sein. Ein zweiter Durchgang macht das Ergebnis sicherer."];
}

  const chips = (c) => r.items.filter(x => x.c === c).map(x => `<span class="chip ${x.ok ? "ok" : "no"}">${x.ok ? "✓" : "✗"} ${x.w}</span>`).join("");

// ---------- Rendern ----------
let premiumFrom = "lab";
function render() {
  $("#view").innerHTML = V[state.view]();
  renderTabs();
  const f = $("#qa, #da, #ta"); if (f) f.focus();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.tab && b.dataset.view) { if (b.dataset.view === "myths") openMyth = -1; return go(b.dataset.view, b.dataset.tab); }
  if (b.dataset.go) {
    if (b.dataset.go === "premium") premiumFrom = state.view;
    if (b.dataset.go === "labTestStart") return startDelayedTest();
    return go(b.dataset.go, b.dataset.tab);
  }
  const a = b.dataset.act; if (!a) return;
  if (a === "startTest") { test = { i: 0, answers: [] }; go("test"); }
  else if (a === "testBack") { if (test.i === 0) go("testIntro"); else { test.i--; render(); } }
  else if (a === "answer") {
    test.answers[test.i] = +b.dataset.v;
    if (test.i < ITEMS.length - 1) { test.i++; setTimeout(render, 120); b.classList.add("on"); }
    else { store.set("profile", { means: means(test.answers), at: Date.now() }); go("result"); }
  }
  else if (a === "predict") { newLab(b.dataset.v); go("labStudy"); }
  else if (a === "studyNext") {
    if (++lab.pos < 16) render(); else { lab.phase = "practice"; lab.order = shuffle(lab.order); lab.pos = 0; go("labPractice"); }
  }
  else if (a === "practiceNext") {
    lab.answered = null;
    if (++lab.pos < 16) render(); else go("labPause");
  }
  else if (a === "later") {
    store.set("pending", { pred: lab.pred, cond: lab.cond, learnedAt: Date.now(), due: Date.now() + 2 * 864e5 });
    lab = null; go("labSaved");
  }
  else if (a === "now") { lab.delayed = false; nextDistract(0); }
  else if (a === "skipDistract") beginTest();
  else if (a === "dropPending") { store.del("pending"); render(); }
  else if (a === "myth") { const i = +b.dataset.i; openMyth = openMyth === i ? -1 : i; render(); }
  else if (a === "reset") go("confirmReset");
  else if (a === "doReset") { store.del("profile"); store.del("runs"); store.del("pending"); go("profile"); }
  else if (a === "buy") { $("#buyNote").hidden = false; }
  else if (a === "backFromPremium") go(premiumFrom);
});

function nextDistract(k) {
  if (k >= 5) return beginTest();
  lab.distract = { k, a: 40 + Math.floor(Math.random() * 60), b: 6 + Math.floor(Math.random() * 13) };
  go("labDistract");
}
function beginTest() { lab.phase = "test"; lab.order = shuffle(WORDS.map((_, i) => i)); lab.pos = 0; lab.answers = {}; go("labTest"); }
function startDelayedTest() {
  const p = store.get("pending", null); if (!p) return go("lab", "labor");
  lab = { pred: p.pred, cond: p.cond, delayed: Date.now() - p.learnedAt > 20 * 3600e3 };
  beginTest();
}

document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "qf") {
    const wi = lab.order[lab.pos];
    lab.answered = correct($("#qa").value, WORDS[wi]);
    render();
  } else if (e.target.id === "df") {
    nextDistract(lab.distract.k + 1);
  } else if (e.target.id === "tf") {
    lab.answers[lab.order[lab.pos]] = $("#ta").value;
    if (++lab.pos < 16) render(); else finishTest();
  }
});

function finishTest() {
  const items = WORDS.map((w, i) => ({ w: w[0] + " = " + w[1], c: lab.cond[i], ok: correct(lab.answers[i] || "", w) }));
  const r = { pred: lab.pred, delayed: !!lab.delayed, items, at: Date.now(),
    read: items.filter(x => x.c === "read" && x.ok).length, quiz: items.filter(x => x.c === "quiz" && x.ok).length };
  const runs = store.get("runs", []); runs.push({ read: r.read, quiz: r.quiz, delayed: r.delayed, pred: r.pred, at: r.at }); store.set("runs", runs);
  store.del("pending");
  lab.result = r; go("labResult", "labor");
}

render();
</script>
