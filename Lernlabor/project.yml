name: Lernlabor
options:
  bundleIdPrefix: de.podolskis
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Eigene Apple-Team-ID hier eintragen (oder in Xcode unter "Signing & Capabilities" wählen)
    DEVELOPMENT_TEAM: ""
targets:
  Lernlabor:
    type: application
    platform: iOS
    sources:
      - path: Lernlabor
        excludes:
          - "**/*.xcprivacy"
          - "**/*.storekit"
      - path: Lernlabor/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.podolskis.lernlabor
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Lernlabor/Info.plist
      properties:
        CFBundleDisplayName: Lernlabor
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LernlaborTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LernlaborTests
    dependencies:
      - target: Lernlabor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: de.podolskis.lernlabor.tests
schemes:
  Lernlabor:
    build:
      targets:
        Lernlabor: all
    run:
      config: Debug
      # Testkäufe ohne echtes Geld, solange die App aus Xcode gestartet wird
      storeKitConfiguration: Lernlabor/Resources/Lernlabor.storekit
    test:
      targets:
        - LernlaborTests
